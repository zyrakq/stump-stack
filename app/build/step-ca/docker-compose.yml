x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  stump:
    container_name: stump
    image: ${IMAGE:-aaronleopold/stump:latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      STUMP_ENABLE_UPLOAD: ${STUMP_ENABLE_UPLOAD:-true}
      UPLOAD_FILE: ${UPLOAD_FILE:-true}
      DOWNLOAD_FILE: ${DOWNLOAD_FILE:-true}
      STUMP_TRUST_PROXY_HEADERS: ${STUMP_TRUST_PROXY_HEADERS:-true}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - stump-config:/config
      - stump-data:/data
      - step-ca-vhost:/vhost.d
    configs:
      - source: vhost
        target: ${VHOST_PATH:-/vhost.d/${VIRTUAL_HOST}}
    networks:
      - step-ca-network
volumes:
  stump-config:
    name: stump-config
  stump-data:
    name: stump-data
  step-ca-vhost:
    external: true
configs:
  vhost:
    content: |
      client_max_body_size 0;
      chunked_transfer_encoding on;
networks:
  step-ca-network:
    external: true
